name: Apply global replay speed policy
on:
  push:
    branches: [feature/hardware-zero-copy]
    paths:
      - '.github/scripts/patch-global-replay-speed.py'
      - '.github/workflows/apply-global-replay-speed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
      - name: Apply patch
        run: python3 .github/scripts/patch-global-replay-speed.py
      - name: Format sources
        run: |
          clang-format -i src/sr-config.c src/sr-config.h src/sr-replay-channel.c src/sr-replay-channel.h src/sr-replay-take.c src/sr-event-dock.cpp src/sr-dock.cpp
      - name: Validate speed policy
        run: |
          grep -q 'SR_REPLAY_SPEED_GLOBAL' src/sr-config.h
          grep -q 'sr_replay_channel_set_controller_speed' src/sr-replay-channel.c
          grep -q 'setOperatorSpeed' src/sr-event-dock.cpp
          grep -q 'Dock.ReplaySpeedPolicy.Global' data/locale/en-US.ini
          grep -q 'sr_config_get_event_transition_match_replay_speed' src/sr-replay-take.c
      - name: Commit product changes and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sr-config.c src/sr-config.h src/sr-replay-channel.c src/sr-replay-channel.h src/sr-replay-take.c src/sr-event-dock.cpp src/sr-dock.cpp data/locale/en-US.ini data/locale/es-ES.ini
          git rm -f .github/scripts/patch-global-replay-speed.py .github/workflows/apply-global-replay-speed.yml
          git commit -m 'feat: add global replay speed policy'
          git push origin HEAD:feature/hardware-zero-copy
