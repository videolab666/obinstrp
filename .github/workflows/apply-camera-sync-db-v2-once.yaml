name: One-shot camera sync and EventDB v2

on:
  push:
    branches:
      - feature/disk-replay-core
    paths:
      - '.github/workflows/apply-camera-sync-db-v2-once.yaml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0
      - name: Apply camera sync and EventDB v2
        run: python3 .github/scripts/apply_camera_sync_and_db_v2.py
      - name: Install formatters
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew tap obsproject/tools
          brew install --quiet obsproject/tools/clang-format@19
          brew install --quiet obsproject/tools/gersemi
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"
      - name: Format and commit
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./build-aux/run-clang-format src/sr-capture.h src/capture-filter.c src/sr-camera-identity.c src/sr-camera-identity.h src/sr-replay-coverage.c src/sr-replay-coverage.h src/sr-replay-channel.c src/sr-replay-channel.h src/sr-event-db.c src/sr-event-db.h
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/locale/en-US.ini data/locale/es-ES.ini src/sr-capture.h src/capture-filter.c src/sr-camera-identity.c src/sr-camera-identity.h src/sr-replay-coverage.c src/sr-replay-coverage.h src/sr-replay-channel.c src/sr-replay-channel.h src/sr-event-db.c src/sr-event-db.h
          git diff --cached --check
          git commit -m "feat: add per-camera replay sync offsets"
          git push origin HEAD:feature/disk-replay-core
