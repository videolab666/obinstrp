name: Format compact operator UI

on:
  push:
    branches:
      - feature/hardware-zero-copy
    paths:
      - .github/workflows/format-compact-operator-ui.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0
      - name: Format with CI clang-format 19.1.1
        shell: bash
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew install --quiet obsproject/tools/clang-format@19
          export PATH="$(brew --prefix obsproject/tools/clang-format@19)/bin:$PATH"
          ./build-aux/run-clang-format src/sr-event-dock.cpp
          git rm .github/workflows/format-compact-operator-ui.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sr-event-dock.cpp
          git commit -m "style: format compact operator UI"
          git push origin HEAD:feature/hardware-zero-copy
