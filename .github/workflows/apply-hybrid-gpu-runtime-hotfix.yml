name: Apply hybrid GPU replay safety hotfix
run-name: Apply hybrid GPU replay safety hotfix

on:
  push:
    branches:
      - feature/hardware-zero-copy

permissions:
  contents: write

concurrency:
  group: apply-hybrid-gpu-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-19
      - name: Apply runtime safety hotfix
        run: |
          python3 .github/hotfix-hybrid-gpu-runtime.py
          clang-format-19 -i src/sr-gpu-video.h src/sr-gpu-video.cpp src/sr-gpu-encoder.cpp src/sr-program-recorder.c src/sr-disk-player.h src/sr-disk-player.c src/sr-multiview-dock.cpp
          git diff --check
      - name: Commit product change
        run: |
          git add src/sr-gpu-video.h src/sr-gpu-video.cpp src/sr-gpu-encoder.cpp src/sr-program-recorder.c src/sr-disk-player.h src/sr-disk-player.c src/sr-multiview-dock.cpp
          if git diff --cached --quiet; then
            echo "Already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make replay safe on hybrid Intel NVIDIA systems"
          git push origin HEAD:feature/hardware-zero-copy
