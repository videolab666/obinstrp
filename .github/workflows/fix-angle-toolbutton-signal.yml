name: Fix angle preview toolbutton signal

on:
  push:
    branches: [feature/hardware-zero-copy]
    paths:
      - '.github/workflows/fix-angle-toolbutton-signal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
      - name: Fix signal type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/sr-event-dock.cpp')
          s = p.read_text(encoding='utf-8')
          old = 'connect(button, &QPushButton::clicked, this, [this, camera]() { selectAngle(camera); });'
          new = 'connect(button, &QToolButton::clicked, this, [this, camera]() { selectAngle(camera); });'
          if old not in s:
              raise SystemExit('angle signal anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          clang-format -i src/sr-event-dock.cpp
      - name: Commit and remove helper
        run: |
          rm -f .github/workflows/fix-angle-toolbutton-signal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: connect angle preview toolbuttons'
          git push origin HEAD:feature/hardware-zero-copy
