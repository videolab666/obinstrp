name: Session Timecode Hardening

on:
  push:
    branches:
      - feature/session-timecode-hardening

permissions:
  contents: write

jobs:
  apply-zero-time-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply zero-time UI compatibility
        run: python3 .github/scripts/patch-zero-session-time-ui.py
      - name: Format changed C++ files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-19
          clang-format-19 -i src/sr-event-dock.cpp src/sr-multiview-dock.cpp
      - name: Validate zero Session timestamp handling
        run: |
          git diff --check
          grep -q 'if (endNs <= startNs)' src/sr-event-dock.cpp
          ! grep -q 'if (!startNs || endNs <= startNs)' src/sr-event-dock.cpp
          grep -q 'if (player) {' src/sr-multiview-dock.cpp
          ! grep -q 'if (player && timestampNs)' src/sr-multiview-dock.cpp
      - name: Commit zero-time compatibility
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sr-event-dock.cpp src/sr-multiview-dock.cpp
          git diff --cached --check
          git commit -m 'fix: support zero-based Session timelines in UI'
          git push origin HEAD:feature/session-timecode-hardening
