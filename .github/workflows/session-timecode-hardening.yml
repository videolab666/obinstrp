name: Session Timecode Hardening

on:
  push:
    branches:
      - feature/session-timecode-hardening

permissions:
  contents: write

jobs:
  apply-final-ui-hardening:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final Session guards
        run: python3 .github/scripts/patch-session-final-guards.py
      - name: Apply Event timeline focus and Multiview ruler
        run: python3 .github/scripts/patch-event-timeline-focus.py
      - name: Format changed C/C++ files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-19
          mapfile -t files < <(git diff --name-only -- '*.c' '*.h' '*.cpp')
          if ((${#files[@]})); then
            clang-format-19 -i "${files[@]}"
          fi
      - name: Validate patch before commit
        run: |
          git diff --check
          grep -q 'focusSelection(event.in_ns, event.out_ns)' src/sr-event-dock.cpp
          grep -q 'focusedEventId' src/sr-multiview-dock.cpp
          grep -q 'pixels >= 88.0L' src/sr-multiview-dock.cpp
          grep -q 'uint64_t result = 0;' src/sr-session.c
      - name: Commit patched sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git diff --cached --check
          git commit -m 'feat: focus selected replay events on timeline'
          git push origin HEAD:feature/session-timecode-hardening
