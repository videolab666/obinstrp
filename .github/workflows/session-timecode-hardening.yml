name: Session Timecode Hardening

on:
  push:
    branches:
      - feature/session-timecode-hardening

permissions:
  contents: write

jobs:
  apply-generation-guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply generation ownership guards
        run: python3 .github/scripts/patch-session-generation-guards.py
      - name: Format changed C/C++ files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-19
          mapfile -t files < <(git diff --name-only -- '*.c' '*.h' '*.cpp')
          if ((${#files[@]})); then
            clang-format-19 -i "${files[@]}"
          fi
      - name: Commit hardened sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git diff --cached --check
          git commit -m 'fix: bind replay writers to recording generations'
          git push origin HEAD:feature/session-timecode-hardening
