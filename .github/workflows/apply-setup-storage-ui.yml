name: Apply replay setup and storage UI patch

on:
  push:
    branches:
      - feature/hardware-zero-copy
    paths:
      - 'tools/apply_setup_storage_ui.py'
      - '.github/workflows/apply-setup-storage-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python3 tools/apply_setup_storage_ui.py

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Format C++ sources
        run: clang-format -i src/sr-event-dock.cpp src/sr-dock.cpp

      - name: Validate patch
        run: git diff --check

      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sr-event-dock.cpp src/sr-dock.cpp data/locale/en-US.ini data/locale/es-ES.ini
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
            exit 0
          fi
          git commit -m 'feat: streamline replay source setup and storage management'
          git push
