name: Apply thumbnail layout fix

on:
  push:
    branches:
      - feature/hardware-zero-copy
    paths:
      - .github/workflows/apply-thumbnail-layout-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0

      - name: Apply thumbnail UX patch
        run: python3 .github/scripts/fix-thumbnail-layout.py

      - name: Format source
        run: clang-format -i src/sr-event-dock.cpp

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SrEventThumbnailDelegate' src/sr-event-dock.cpp
          grep -q 'EVENT_THUMB_DISPLAY_WIDTH = 176' src/sr-event-dock.cpp
          grep -q 'EVENT_THUMB_CELL_WIDTH = 184' src/sr-event-dock.cpp
          grep -q 'setFixedHeight(132)' src/sr-event-dock.cpp
          grep -q 'anglePreviewCache' src/sr-event-dock.cpp
          ! grep -A8 'if (previewTargetEventId != eventId)' src/sr-event-dock.cpp | grep -q 'setIcon(QIcon())'

      - name: Commit product changes and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/scripts/fix-thumbnail-layout.py .github/workflows/apply-thumbnail-layout-fix.yml
          git add -A
          git commit -m 'fix: stabilize replay thumbnail layouts'
          git push origin HEAD:feature/hardware-zero-copy
