name: Apply Program sRGB fix

on:
  push:
    branches: [feature/hardware-zero-copy]
    paths:
      - '.github/workflows/apply-program-srgb-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0
      - name: Apply sRGB fix
        run: python3 .github/scripts/patch-program-srgb.py
      - name: Format
        run: clang-format -i src/sr-gpu-encoder.cpp
      - name: Validate sRGB contract
        run: |
          grep -q 'gs_framebuffer_srgb_enabled' src/sr-gpu-encoder.cpp
          grep -q 'gs_enable_framebuffer_srgb(true)' src/sr-gpu-encoder.cpp
          grep -q 'gs_enable_framebuffer_srgb(previous_srgb)' src/sr-gpu-encoder.cpp
          grep -q 'gs_effect_set_texture_srgb(image, texture)' src/sr-gpu-encoder.cpp
      - name: Commit product fix and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/patch-program-srgb.py .github/workflows/apply-program-srgb-fix.yml
          git add src/sr-gpu-encoder.cpp
          git commit -m 'fix: preserve Program output sRGB gamma'
          git push origin HEAD:feature/hardware-zero-copy
