name: One-shot exact replay frame stepping

on:
  push:
    branches:
      - feature/disk-replay-core
    paths:
      - '.github/workflows/apply-frame-step-once.yaml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0

      - name: Apply integration
        run: python3 .github/scripts/apply_frame_step.py

      - name: Install clang-format 19
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew tap obsproject/tools
          brew install --quiet obsproject/tools/clang-format@19
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"

      - name: Format and commit
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./build-aux/run-clang-format \
            src/sr-disk-player.c \
            src/sr-disk-player.h \
            src/sr-replay-channel.c \
            src/sr-replay-channel.h \
            src/sr-event-dock.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/locale/en-US.ini \
            src/sr-disk-player.c \
            src/sr-disk-player.h \
            src/sr-replay-channel.c \
            src/sr-replay-channel.h \
            src/sr-event-dock.cpp
          if git diff --cached --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git commit -m "feat: add exact replay frame stepping"
          git push origin HEAD:feature/disk-replay-core
