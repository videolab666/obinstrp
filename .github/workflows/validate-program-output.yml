name: Replay Development CI
run-name: Replay Development CI — ${{ github.ref_name }} — ${{ github.event_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hardware-zero-copy
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'buildspec.json'
      - '.github/workflows/validate-program-output.yml'
      - '.github/workflows/build-project.yaml'
      - '.github/workflows/check-format.yaml'
  pull_request:
    branches:
      - feature/disk-replay-core
      - main
      - master
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'buildspec.json'
      - '.github/workflows/validate-program-output.yml'
      - '.github/workflows/build-project.yaml'
      - '.github/workflows/check-format.yaml'

permissions:
  contents: read

concurrency:
  group: replay-development-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Full development validation for the replay feature branch. Keeping
# workflow_dispatch here allows the same build to be started manually, while
# push and pull_request cover normal development without relying on ad-hoc CI
# branches or narrow per-file filters.
jobs:
  check-format:
    name: Check Formatting 🔍
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read
