name: Quick-mark duration fix applicator
run-name: Apply real recording bounds to quick marks

on:
  push:
    branches:
      - feature/hardware-zero-copy

permissions:
  contents: write
  actions: write

concurrency:
  group: quick-mark-duration-applicator
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0

      - name: Apply product patch
        run: python3 .github/fix-quick-mark-duration.py

      - name: Validate product patch
        run: |
          git diff --check
          grep -F 'uint64_t recording_start_ns;' src/sr-capture.h
          grep -F 'effective_pre_roll_ns' src/sr-event-controller.c
          grep -F 'summary->recording_start_ns = g_program.recording_start_ns;' src/sr-program-recorder.c
          grep -F 'ctx->summary->recording_start_ns = status.recording_start_ns;' src/capture-filter.c

      - name: Restore normal validation workflow
        run: |
          git show 398405c450fb3dd00a9499942c480bccef5ef773:.github/workflows/validate-program-output.yml > .github/workflows/validate-program-output.yml
          rm -f .github/fix-quick-mark-duration.py
          git diff --check

      - name: Commit and publish product fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git commit -m 'fix: clamp quick marks to recorded media start'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:feature/hardware-zero-copy; then
              exit 0
            fi
            echo "Push attempt ${attempt} raced with another update; rebasing and retrying"
            git pull --rebase origin feature/hardware-zero-copy
            sleep 2
          done
          exit 1

      - name: Start final validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate-program-output.yml --ref feature/hardware-zero-copy
