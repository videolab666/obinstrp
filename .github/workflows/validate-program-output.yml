name: Professional timeline hardening applicator
run-name: Harden professional replay timeline

on:
  push:
    branches:
      - feature/hardware-zero-copy

permissions:
  contents: write
  actions: write

concurrency:
  group: professional-timeline-hardening
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0

      - name: Install clang-format 19
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-19

      - name: Apply timeline hardening
        run: |
          python3 .github/scripts/harden-professional-timeline.py
          clang-format-19 -i src/sr-event-dock.cpp
          git diff --check

      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden professional replay timeline'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:feature/hardware-zero-copy; then
              exit 0
            fi
            git pull --rebase origin feature/hardware-zero-copy
            sleep 2
          done
          exit 1

      - name: Start final validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate-program-output.yml --ref feature/hardware-zero-copy
