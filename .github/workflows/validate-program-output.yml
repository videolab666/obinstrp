name: Replay Qt6 toggle fix applicator
run-name: Apply Qt6 replay setup compile fix

on:
  push:
    branches:
      - feature/hardware-zero-copy

permissions:
  contents: write
  actions: write

concurrency:
  group: replay-qt6-toggle-fix
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0

      - name: Apply Qt6-safe toggle lookup
        run: python3 .github/fix-qt-toggle-findchild.py

      - name: Validate patch
        run: |
          git diff --check
          test "$(grep -F -c 'cell->findChild<QCheckBox *>()' src/sr-event-dock.cpp)" -eq 2
          ! grep -F 'cell->findChild<ToggleSwitch *>()' src/sr-event-dock.cpp

      - name: Restore normal CI and remove helper
        run: |
          git show e95bf24cacddfc45b716bba329c03438a130e08b:.github/workflows/validate-program-output.yml > .github/workflows/validate-program-output.yml
          rm -f .github/fix-qt-toggle-findchild.py
          git diff --check

      - name: Commit and publish fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git commit -m 'fix: make replay setup switches Qt6-safe'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:feature/hardware-zero-copy; then
              exit 0
            fi
            echo "Push attempt ${attempt} raced with another update; rebasing and retrying"
            git pull --rebase origin feature/hardware-zero-copy
            sleep 2
          done
          exit 1

      - name: Start final validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate-program-output.yml --ref feature/hardware-zero-copy
