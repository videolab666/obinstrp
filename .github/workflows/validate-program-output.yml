name: Validate Program Output replay
run-name: Program Output replay full validation
on:
  push:
    branches: [feature/hardware-zero-copy]
    paths:
      - '.github/workflows/validate-program-output.yml'
      - 'src/sr-program-recorder.c'
      - 'src/sr-program-recorder.h'
      - 'src/sr-gpu-encoder.cpp'
      - 'src/sr-codec.h'
      - 'src/sr-camera-identity.c'
      - 'src/sr-camera-identity.h'
      - 'src/sr-camera-list.c'
      - 'src/sr-replay-setup.c'
      - 'src/sr-replay-setup.h'
      - 'src/capture-filter.c'
      - 'src/sr-event-output.c'
      - 'src/sr-replay-playlist.c'
      - 'src/sr-event-dock.cpp'

permissions:
  contents: read

jobs:
  check-format:
    name: Check Formatting 🔍
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read
