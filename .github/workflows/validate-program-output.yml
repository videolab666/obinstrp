name: Timeline editor applicator
run-name: Apply full recording timeline editor

on:
  push:
    branches:
      - feature/hardware-zero-copy

permissions:
  contents: write
  actions: write

concurrency:
  group: timeline-editor-applicator
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0

      - name: Apply product patch
        run: python3 .github/apply-edit-timeline.py

      - name: Validate product patch
        run: |
          git diff --check
          grep -F 'constexpr int TIMELINE_SCALE = 1000000;' src/sr-event-dock.cpp
          grep -F 'EventDock.Timeline.EditTooltip' data/locale/en-US.ini
          grep -F 'brew trust obsproject/tools' .github/actions/run-clang-format/action.yaml
          grep -F 'void editSelectedEventRange(int rangeIn, int rangeOut)' src/sr-event-dock.cpp
          grep -F 'bool previewSelectedEvent(bool force)' src/sr-event-dock.cpp

      - name: Restore normal validation workflow
        run: |
          git show e63ae32090bc0bcbd7d4e1a1c6fd37d36d39d0e7:.github/workflows/validate-program-output.yml > .github/workflows/validate-program-output.yml
          rm -f .github/apply-edit-timeline.py
          git diff --check

      - name: Commit and publish product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git commit -m 'feat: add full recording Event trim timeline'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:feature/hardware-zero-copy; then
              exit 0
            fi
            echo "Push attempt ${attempt} raced with another update; rebasing and retrying"
            git pull --rebase origin feature/hardware-zero-copy
            sleep 2
          done
          exit 1

      - name: Start final validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate-program-output.yml --ref feature/hardware-zero-copy
