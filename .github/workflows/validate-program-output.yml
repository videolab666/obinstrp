name: Replay Development CI
run-name: Replay Development CI — ${{ github.ref_name }} — ${{ github.event_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - feature/hardware-zero-copy
  pull_request:
    branches:
      - feature/disk-replay-core
      - main
      - master

permissions:
  contents: read

concurrency:
  group: replay-development-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Full validation for replay development. Every push to the active replay
# feature branch is built deliberately: maintaining a narrow paths list is too
# easy to get wrong for cross-cutting render/encode/playback changes. The same
# workflow is also available from Actions via workflow_dispatch.
jobs:
  check-format:
    name: Check Formatting 🔍
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read
