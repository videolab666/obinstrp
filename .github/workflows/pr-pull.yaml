name: Pull Request
run-name: ${{ github.event.pull_request.title }} pull request run 🚀
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
    branches: [master, main]
    types: [ opened, synchronize, reopened ]
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true
jobs:
  apply-highlight-playlist:
    name: Apply highlight reel integration once
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0
      - name: Apply integration if needed
        run: |
          if [ -f src/sr-replay-playlist.c ]; then
            echo "Highlight reel core already exists; nothing to apply."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_highlight_playlist.py')
          text = path.read_text(encoding='utf-8')
          old = "replace_once(dock, '\\tvoid takeBus(enum sr_replay_bus bus)\\n{', playlist_methods + '\\tvoid takeBus(enum sr_replay_bus bus)\\n{')"
          new = "replace_once(dock, '\\tvoid takeBus(enum sr_replay_bus bus)\\n\\t{', playlist_methods + '\\tvoid takeBus(enum sr_replay_bus bus)\\n\\t{')"
          if old not in text:
              raise SystemExit('playlist method insertion anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .github/scripts/apply_highlight_playlist.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/sr-replay-playlist.c')
          text = path.read_text(encoding='utf-8')
          include_old = '#include <obs-module.h>\n#include <util/bmem.h>\n\n#include <string.h>\n'
          include_new = '#include <obs-module.h>\n#include <util/bmem.h>\n\n#include <pthread.h>\n#include <string.h>\n'
          if include_old not in text:
              raise SystemExit('pthread include anchor not found')
          text = text.replace(include_old, include_new, 1)
          old = '''    playlist->event_id = event_ids[first];
              playlist->preferred_camera = bstrdup(preferred_camera ? preferred_camera : "");
              pthread_mutex_unlock(&g_mutex);

              blog(LOG_INFO, "Sports Replay: started Event List %u highlight reel on bus %c at item %zu/%zu (Event %llu)",
                   list_id, bus == SR_REPLAY_BUS_A ? 'A' : 'B', first + 1, count, (unsigned long long)event_ids[first]);
          '''
          new = '''    playlist->event_id = event_ids[first];
              playlist->preferred_camera = bstrdup(preferred_camera ? preferred_camera : "");
              const uint64_t first_event_id = playlist->event_id;
              pthread_mutex_unlock(&g_mutex);

              blog(LOG_INFO, "Sports Replay: started Event List %u highlight reel on bus %c at item %zu/%zu (Event %llu)",
                   list_id, bus == SR_REPLAY_BUS_A ? 'A' : 'B', first + 1, count, (unsigned long long)first_event_id);
          '''
          if old not in text:
              raise SystemExit('playlist start hardening anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install formatters
        run: |
          if [ -f src/sr-replay-playlist.c ] && ! git diff --quiet; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            brew install --quiet zsh
            brew install --quiet obsproject/tools/clang-format@19
            brew install --quiet obsproject/tools/gersemi
            echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
            echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"
          fi
      - name: Format and commit
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./build-aux/run-clang-format src/sr-replay-playlist.c src/sr-replay-playlist.h src/sr-replay-channel.c src/sr-event-output.c src/sr-replay-take.c src/plugin-main.c src/sr-event-dock.cpp
          ./build-aux/run-gersemi CMakeLists.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt data/locale/en-US.ini src/sr-replay-playlist.c src/sr-replay-playlist.h src/sr-replay-channel.c src/sr-event-output.c src/sr-replay-take.c src/plugin-main.c src/sr-event-dock.cpp
          git diff --cached --check
          git commit -m "feat: add Event List highlight reel playback"
          git push origin HEAD:feature/disk-replay-core

  check-format:
    name: Check Formatting 🔍
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read
