name: Fix Replay Setup OBS API compatibility

on:
  push:
    paths:
      - '.github/workflows/fix-replay-setup-api.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0
      - name: Apply compatibility and safety fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/sr-replay-setup.c')
          s = p.read_text(encoding='utf-8')
          old = '''\tobs_source_t *scene_source = obs_scene_get_source(scene);\n\tif (scene_source)\n\t\tobs_source_addref(scene_source);\n\tobs_scene_release(scene);\n'''
          new = '''\tobs_source_t *scene_source = obs_source_get_ref(obs_scene_get_source(scene));\n\tobs_scene_release(scene);\n'''
          if old not in s:
              raise SystemExit('scene source ref pattern not found')
          s = s.replace(old, new, 1)
          old = '''\t\tif (filter) {\n\t\t\tobs_source_set_enabled(filter, true);\n\t\t\tobs_source_release(filter);\n'''
          new = '''\t\tif (filter) {\n\t\t\t/* A disabled filter can retain an old recording intent if it was\n\t\t\t * disabled outside the dock. Clear that intent before enabling it so\n\t\t\t * Replay Setup never starts disk recording implicitly. */\n\t\t\tdisable_capture_before_remove(filter);\n\t\t\tobs_source_set_enabled(filter, true);\n\t\t\tobs_source_release(filter);\n'''
          if old not in s:
              raise SystemExit('capture re-enable pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install clang-format 19
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet obsproject/tools/clang-format@19
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"
      - name: Format and commit
        run: |
          clang-format-19 -i src/sr-replay-setup.c
          git diff --check
          rm -f .github/workflows/fix-replay-setup-api.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use OBS 31 source ref API in Replay Setup'
          git push origin HEAD:feature/hardware-zero-copy
