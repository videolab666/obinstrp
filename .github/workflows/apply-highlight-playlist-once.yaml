name: One-shot highlight reel playlist integration

on:
  push:
    branches: [feature/disk-replay-core]
    paths:
      - '.github/workflows/apply-highlight-playlist-once.yaml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0

      - name: Apply highlight reel integration
        run: python3 .github/scripts/apply_highlight_playlist.py

      - name: Harden generated playlist core
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/sr-replay-playlist.c')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '#include <obs-module.h>\n#include <util/bmem.h>\n\n#include <string.h>\n',
              '#include <obs-module.h>\n#include <util/bmem.h>\n\n#include <pthread.h>\n#include <string.h>\n',
              1,
          )
          old = '''    playlist->event_id = event_ids[first];
              playlist->preferred_camera = bstrdup(preferred_camera ? preferred_camera : "");
              pthread_mutex_unlock(&g_mutex);

              blog(LOG_INFO, "Sports Replay: started Event List %u highlight reel on bus %c at item %zu/%zu (Event %llu)",
                   list_id, bus == SR_REPLAY_BUS_A ? 'A' : 'B', first + 1, count, (unsigned long long)event_ids[first]);
          '''
          new = '''    playlist->event_id = event_ids[first];
              playlist->preferred_camera = bstrdup(preferred_camera ? preferred_camera : "");
              const uint64_t first_event_id = playlist->event_id;
              pthread_mutex_unlock(&g_mutex);

              blog(LOG_INFO, "Sports Replay: started Event List %u highlight reel on bus %c at item %zu/%zu (Event %llu)",
                   list_id, bus == SR_REPLAY_BUS_A ? 'A' : 'B', first + 1, count, (unsigned long long)first_event_id);
          '''
          if old not in text:
              raise SystemExit('playlist start hardening anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install formatters
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew install --quiet obsproject/tools/clang-format@19
          brew install --quiet obsproject/tools/gersemi
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"

      - name: Format changed source
        shell: zsh --no-rcs --errexit --pipefail {0}
        run: |
          ./build-aux/run-clang-format src/sr-replay-playlist.c src/sr-replay-playlist.h src/sr-replay-channel.c src/sr-event-output.c src/sr-replay-take.c src/plugin-main.c src/sr-event-dock.cpp
          ./build-aux/run-gersemi CMakeLists.txt

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt data/locale/en-US.ini src/sr-replay-playlist.c src/sr-replay-playlist.h src/sr-replay-channel.c src/sr-event-output.c src/sr-replay-take.c src/plugin-main.c src/sr-event-dock.cpp
          git diff --cached --check
          git commit -m "feat: add Event List highlight reel playback"
          git push origin HEAD:feature/disk-replay-core
