name: One-shot decoded replay frame cache

on:
  push:
    branches:
      - feature/disk-replay-core
    paths:
      - '.github/workflows/frame-cache-once.yaml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0

      - name: Apply playback cache migration
        shell: bash
        run: python3 build-aux/apply-frame-cache-playback.py

      - name: Install clang-format
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew tap obsproject/tools
          brew install --quiet obsproject/tools/clang-format@19
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"

      - name: Format touched sources
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./build-aux/run-clang-format \
            src/sr-frame-cache.c \
            src/sr-frame-cache.h \
            src/sr-replay-decode.c \
            src/sr-replay-decode.h \
            src/playback-source.c

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src
          git commit -m "perf: cache decoded frames for reverse and jog"
          git push origin HEAD:feature/disk-replay-core
