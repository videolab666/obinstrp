name: One-shot atomic EventDB migration

on:
  push:
    branches:
      - feature/disk-replay-core
    paths:
      - '.github/workflows/atomic-eventdb-once.yaml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0

      - name: Add atomic Event/list operations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          db_path = Path('src/sr-event-db.c')
          db = db_path.read_text(encoding='utf-8')
          marker = 'bool sr_event_db_get_list_events(struct sr_event_db *db, unsigned list_id, uint64_t **event_ids, size_t *count)\n'
          if 'bool sr_event_db_create_event_in_list(' not in db:
              atomic = r'''
bool sr_event_db_create_event_in_list(struct sr_event_db *db, const struct sr_event_write *event, unsigned list_id,
                                      int position, uint64_t *event_id)
{
    if (!db || !valid_event(event) || !valid_list_id(list_id))
        return false;

    pthread_mutex_lock(&db->mutex);
    if (!begin_transaction(db)) {
        pthread_mutex_unlock(&db->mutex);
        return false;
    }

    sqlite3_stmt *stmt = NULL;
    const char *event_sql =
        "INSERT INTO events(in_ns,out_ns,preferred_camera_id,speed_percent,audio_mode,protected_event,played,pending,name,tag) "
        "VALUES(?,?,?,?,?,?,?,?,?,?)";
    int rc = sqlite3_prepare_v2(db->sql, event_sql, -1, &stmt, NULL);
    bool ok = rc == SQLITE_OK && bind_event(stmt, 1, event);
    if (ok) {
        rc = sqlite3_step(stmt);
        ok = rc == SQLITE_DONE;
    }
    if (!ok)
        log_sql_error(db, "create event in list", rc);
    sqlite3_finalize(stmt);

    uint64_t id = 0;
    if (ok) {
        id = (uint64_t)sqlite3_last_insert_rowid(db->sql);
        int count = 0;
        ok = list_count_locked(db, list_id, &count);
        if (ok) {
            if (position < 0 || position > count)
                position = count;
            ok = shift_positions_locked(db, list_id, 1, position, true, 0, false, false);
        }
    }

    if (ok) {
        stmt = NULL;
        rc = sqlite3_prepare_v2(db->sql,
                                "INSERT INTO event_list_items(list_id,event_id,position) VALUES(?,?,?)", -1,
                                &stmt, NULL);
        ok = rc == SQLITE_OK && sqlite3_bind_int(stmt, 1, (int)list_id) == SQLITE_OK &&
             sqlite3_bind_int64(stmt, 2, (sqlite3_int64)id) == SQLITE_OK &&
             sqlite3_bind_int(stmt, 3, position) == SQLITE_OK;
        if (ok) {
            rc = sqlite3_step(stmt);
            ok = rc == SQLITE_DONE;
        }
        if (!ok)
            log_sql_error(db, "insert first event list membership", rc);
        sqlite3_finalize(stmt);
    }

    if (ok)
        ok = commit_transaction(db);
    else
        rollback_transaction(db);
    if (ok && event_id)
        *event_id = id;
    pthread_mutex_unlock(&db->mutex);
    return ok;
}

bool sr_event_db_move_event_between_lists(struct sr_event_db *db, uint64_t event_id, unsigned source_list,
                                          unsigned target_list, int position)
{
    if (!db || !event_id || !valid_u64(event_id) || !valid_list_id(source_list) || !valid_list_id(target_list))
        return false;

    pthread_mutex_lock(&db->mutex);
    if (!event_exists_locked(db, event_id)) {
        pthread_mutex_unlock(&db->mutex);
        return false;
    }

    int source_position = -1;
    bool source_found = false;
    if (!list_position_locked(db, source_list, event_id, &source_position, &source_found) || !source_found) {
        pthread_mutex_unlock(&db->mutex);
        return false;
    }
    if (!begin_transaction(db)) {
        pthread_mutex_unlock(&db->mutex);
        return false;
    }

    bool ok = true;
    if (source_list == target_list) {
        ok = reorder_existing_locked(db, source_list, event_id, source_position, position);
    } else {
        int target_position = -1;
        bool target_found = false;
        ok = list_position_locked(db, target_list, event_id, &target_position, &target_found);
        if (ok && target_found) {
            ok = reorder_existing_locked(db, target_list, event_id, target_position, position);
        } else if (ok) {
            int target_count = 0;
            ok = list_count_locked(db, target_list, &target_count);
            if (ok) {
                if (position < 0 || position > target_count)
                    position = target_count;
                ok = shift_positions_locked(db, target_list, 1, position, true, 0, false, false);
            }
            if (ok) {
                sqlite3_stmt *insert = NULL;
                int rc = sqlite3_prepare_v2(
                    db->sql, "INSERT INTO event_list_items(list_id,event_id,position) VALUES(?,?,?)", -1,
                    &insert, NULL);
                ok = rc == SQLITE_OK && sqlite3_bind_int(insert, 1, (int)target_list) == SQLITE_OK &&
                     sqlite3_bind_int64(insert, 2, (sqlite3_int64)event_id) == SQLITE_OK &&
                     sqlite3_bind_int(insert, 3, position) == SQLITE_OK;
                if (ok) {
                    rc = sqlite3_step(insert);
                    ok = rc == SQLITE_DONE;
                }
                if (!ok)
                    log_sql_error(db, "move event: insert target membership", rc);
                sqlite3_finalize(insert);
            }
        }

        if (ok) {
            sqlite3_stmt *remove = NULL;
            int rc = sqlite3_prepare_v2(db->sql,
                                        "DELETE FROM event_list_items WHERE list_id=? AND event_id=?", -1,
                                        &remove, NULL);
            ok = rc == SQLITE_OK && sqlite3_bind_int(remove, 1, (int)source_list) == SQLITE_OK &&
                 sqlite3_bind_int64(remove, 2, (sqlite3_int64)event_id) == SQLITE_OK;
            if (ok) {
                rc = sqlite3_step(remove);
                ok = rc == SQLITE_DONE && sqlite3_changes(db->sql) == 1;
            }
            if (!ok)
                log_sql_error(db, "move event: remove source membership", rc);
            sqlite3_finalize(remove);
        }
        if (ok)
            ok = shift_positions_locked(db, source_list, -1, source_position, false, 0, false, false);
    }

    if (ok)
        ok = commit_transaction(db);
    else
        rollback_transaction(db);
    pthread_mutex_unlock(&db->mutex);
    return ok;
}

'''
              if marker not in db:
                  raise SystemExit('EventDB insertion marker not found')
              db = db.replace(marker, atomic + marker, 1)
              db_path.write_text(db, encoding='utf-8')

          controller_path = Path('src/sr-event-controller.c')
          text = controller_path.read_text(encoding='utf-8')

          start = text.index('static bool create_in_current_list_locked(')
          end = text.index('static bool update_flag_locked(', start)
          create_fn = '''static bool create_in_current_list_locked(struct sr_event_controller *controller, const struct sr_event_write *event,\n                                          uint64_t *event_id)\n{\n    return ensure_db_locked(controller) &&\n           sr_event_db_create_event_in_list(controller->db, event, controller->current_list, -1, event_id);\n}\n\n'''
          text = text[:start] + create_fn + text[end:]

          start = text.index('bool sr_event_controller_move_to_list(')
          end = text.index('bool sr_event_controller_reorder(', start)
          move_fn = '''bool sr_event_controller_move_to_list(struct sr_event_controller *controller, uint64_t event_id, unsigned source_list,\n                                      unsigned target_list, int position)\n{\n    if (!controller || !event_id || !valid_list_id(source_list) || !valid_list_id(target_list))\n        return false;\n\n    pthread_mutex_lock(&controller->mutex);\n    const bool ok = ensure_db_locked(controller) &&\n                    sr_event_db_move_event_between_lists(controller->db, event_id, source_list, target_list, position);\n    pthread_mutex_unlock(&controller->mutex);\n    return ok;\n}\n\n'''
          text = text[:start] + move_fn + text[end:]

          old = '''\tuint64_t duplicate_id = 0;\n\tbool ok = sr_event_db_create_event(controller->db, &write, &duplicate_id);\n\tif (ok) {\n\t\tok = sr_event_db_add_event_to_list(controller->db, target_list, duplicate_id, position);\n\t\tif (!ok)\n\t\t\tsr_event_db_delete_event(controller->db, duplicate_id);\n\t}\n\tsr_event_record_free(&record);\n'''
          new = '''\tuint64_t duplicate_id = 0;\n\tconst bool ok =\n\t\tsr_event_db_create_event_in_list(controller->db, &write, target_list, position, &duplicate_id);\n\tsr_event_record_free(&record);\n'''
          if old not in text:
              raise SystemExit('Duplicate Event block not found')
          text = text.replace(old, new, 1)
          controller_path.write_text(text, encoding='utf-8')
          PY

      - name: Install clang-format 19
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew tap obsproject/tools
          brew install --quiet obsproject/tools/clang-format@19
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"

      - name: Format atomic EventDB changes
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./build-aux/run-clang-format src/sr-event-db.c src/sr-event-db.h src/sr-event-controller.c

      - name: Commit atomic EventDB changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sr-event-db.c src/sr-event-db.h src/sr-event-controller.c
          git commit -m "fix: make Event creation and list moves atomic"
          git push origin HEAD:feature/disk-replay-core
