name: One-shot native OBS Stinger TAKE integration

on:
  push:
    branches:
      - feature/disk-replay-core
    paths:
      - '.github/workflows/apply-native-stinger-take-once.yaml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0

      - name: Apply integration
        run: python3 .github/scripts/apply_native_stinger_take.py

      - name: Install formatters
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew tap obsproject/tools
          brew install --quiet obsproject/tools/clang-format@19 obsproject/tools/gersemi
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"

      - name: Format changed sources
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./build-aux/run-clang-format \
            src/sr-config.c \
            src/sr-config.h \
            src/sr-dock.cpp \
            src/sr-scene-tracker.c \
            src/sr-scene-tracker.h \
            src/sr-replay-take.c \
            src/sr-replay-take.h \
            src/sr-event-dock.cpp \
            src/plugin-main.c

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/locale/en-US.ini \
            src/sr-config.c \
            src/sr-config.h \
            src/sr-dock.cpp \
            src/sr-scene-tracker.c \
            src/sr-scene-tracker.h \
            src/sr-replay-take.c \
            src/sr-replay-take.h \
            src/sr-event-dock.cpp \
            src/plugin-main.c
          if git diff --cached --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git commit -m "feat: integrate native OBS stingers for replay take"
          git push origin HEAD:feature/disk-replay-core
