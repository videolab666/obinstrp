name: Apply compact operator UI

on:
  push:
    branches:
      - feature/hardware-zero-copy
    paths:
      - .github/workflows/apply-compact-operator-ui.yml
      - .github/apply-compact-operator-ui.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0
      - name: Apply UI patch
        run: |
          set -euo pipefail
          python .github/apply-compact-operator-ui.py
          git rm .github/apply-compact-operator-ui.py .github/workflows/apply-compact-operator-ui.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sr-event-dock.cpp src/sr-dock.cpp src/sr-dock.h data/locale/en-US.ini data/locale/es-ES.ini
          git commit -m "feat: compact operator controls and drag range selection"
          git push origin HEAD:feature/hardware-zero-copy
