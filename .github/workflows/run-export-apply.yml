name: Apply Recorder Run Export

on:
  push:
    branches:
      - feature/session-manager

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply Recorder Run export patch
        run: python3 .github/scripts/patch-run-export.py
      - name: Format changed C/C++
        run: |
          FORMATTER="$(command -v clang-format-19 || command -v clang-format)"
          "$FORMATTER" -i \
            src/sr-recording-run-catalog.c \
            src/sr-recording-run-catalog.h \
            src/sr-session-export.cpp
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/sr-recording-run-catalog.c src/sr-recording-run-catalog.h src/sr-session-export.cpp
          git diff --cached --check
          git commit -m "fix: export each Recording Run separately" || exit 0
          git push
