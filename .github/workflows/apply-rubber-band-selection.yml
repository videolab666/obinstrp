name: Apply Event rubber-band selection

on:
  push:
    branches: [feature/hardware-zero-copy]
    paths:
      - '.github/workflows/apply-rubber-band-selection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0

      - name: Patch Event table rubber-band selection
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/sr-event-dock.cpp')
          text = path.read_text(encoding='utf-8')

          old = '#include <QProgressBar>\n#include <QSignalBlocker>'
          new = '#include <QProgressBar>\n#include <QRubberBand>\n#include <QSignalBlocker>'
          assert old in text, 'include anchor missing'
          text = text.replace(old, new, 1)

          anchor = '''class SrEventDock : public QWidget {\n'''
          rubber = r'''class SrEventTable : public QTableWidget {
          public:
          	explicit SrEventTable(QWidget *parent = nullptr)
          		: QTableWidget(parent), rubberBand(new QRubberBand(QRubberBand::Rectangle, viewport()))
          	{
          	}

          	bool selectionGestureActive() const { return rubberCandidate; }

          protected:
          	void mousePressEvent(QMouseEvent *event) override
          	{
          		if (event->button() == Qt::LeftButton && !(event->modifiers() & Qt::AltModifier)) {
          			rubberCandidate = true;
          			rubberSelecting = false;
          			rubberOrigin = event->position().toPoint();
          			rubberAdditive = event->modifiers().testFlag(Qt::ControlModifier);
          			baseRows.clear();
          			if (rubberAdditive && selectionModel()) {
          				const QModelIndexList selected = selectionModel()->selectedRows();
          				baseRows.reserve(selected.size());
          				for (const QModelIndex &index : selected)
          					baseRows.push_back(index.row());
          			}
          			rubberBand->hide();
          		} else {
          			rubberCandidate = false;
          			rubberSelecting = false;
          			rubberBand->hide();
          		}
          		QTableWidget::mousePressEvent(event);
          	}

          	void mouseMoveEvent(QMouseEvent *event) override
          	{
          		if (!rubberCandidate || !(event->buttons() & Qt::LeftButton)) {
          			QTableWidget::mouseMoveEvent(event);
          			return;
          		}

          		const QPoint position = boundedViewportPoint(event->position().toPoint());
          		if (!rubberSelecting && (position - rubberOrigin).manhattanLength() < 4) {
          			event->accept();
          			return;
          		}

          		rubberSelecting = true;
          		const QRect rectangle = QRect(rubberOrigin, position).normalized().intersected(viewport()->rect());
          		rubberBand->setGeometry(rectangle);
          		rubberBand->show();
          		applyRubberSelection(rectangle);
          		event->accept();
          	}

          	void mouseReleaseEvent(QMouseEvent *event) override
          	{
          		if (!rubberCandidate || event->button() != Qt::LeftButton) {
          			QTableWidget::mouseReleaseEvent(event);
          			return;
          		}

          		if (rubberSelecting) {
          			const QPoint position = boundedViewportPoint(event->position().toPoint());
          			const QRect rectangle = QRect(rubberOrigin, position).normalized().intersected(viewport()->rect());
          			applyRubberSelection(rectangle);
          			rubberBand->hide();
          			rubberCandidate = false;
          			rubberSelecting = false;
          			event->accept();
          			return;
          		}

          		rubberCandidate = false;
          		QTableWidget::mouseReleaseEvent(event);
          	}

          private:
          	QPoint boundedViewportPoint(const QPoint &position) const
          	{
          		const QRect bounds = viewport()->rect();
          		return QPoint(qBound(bounds.left(), position.x(), bounds.right()),
          			      qBound(bounds.top(), position.y(), bounds.bottom()));
          	}

          	void applyRubberSelection(const QRect &rectangle)
          	{
          		if (!selectionModel() || !model())
          			return;

          		selectionModel()->clearSelection();
          		if (rubberAdditive) {
          			for (int row : baseRows) {
          				if (row >= 0 && row < rowCount())
          					selectionModel()->select(model()->index(row, 0),
          								 QItemSelectionModel::Select | QItemSelectionModel::Rows);
          			}
          		}

          		for (int row = 0; row < rowCount(); row++) {
          			const QModelIndex index = model()->index(row, 0);
          			QRect rowRectangle = visualRect(index);
          			if (!rowRectangle.isValid())
          				continue;
          			rowRectangle.setLeft(0);
          			rowRectangle.setRight(viewport()->width() - 1);
          			if (rowRectangle.intersects(rectangle))
          				selectionModel()->select(index,
          							 QItemSelectionModel::Select | QItemSelectionModel::Rows);
          		}

          		const QModelIndexList selected = selectionModel()->selectedRows();
          		if (!selected.isEmpty() && !selectionModel()->isSelected(currentIndex()))
          			setCurrentIndex(selected.constFirst());
          	}

          	QRubberBand *rubberBand = nullptr;
          	QPoint rubberOrigin;
          	QVector<int> baseRows;
          	bool rubberCandidate = false;
          	bool rubberSelecting = false;
          	bool rubberAdditive = false;
          };

          class SrEventDock : public QWidget {
          '''
          assert anchor in text, 'SrEventDock anchor missing'
          text = text.replace(anchor, rubber, 1)

          old = 'table = new QTableWidget(this);'
          new = 'table = new SrEventTable(this);'
          assert old in text, 'table construction anchor missing'
          text = text.replace(old, new, 1)

          old = 'if (!controller || !table || tableEditing)\n\t\t\treturn;'
          new = 'if (!controller || !table || tableEditing || table->selectionGestureActive())\n\t\t\treturn;'
          assert old in text, 'refresh guard anchor missing'
          text = text.replace(old, new, 1)

          old = 'QTableWidget *table = nullptr;\n\tQTableWidget *performanceTable = nullptr;'
          new = 'SrEventTable *table = nullptr;\n\tQTableWidget *performanceTable = nullptr;'
          assert old in text, 'member type anchor missing'
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang-format-19 >/dev/null 2>&1; then
            clang-format-19 -i src/sr-event-dock.cpp
          else
            sudo apt-get update -qq
            sudo apt-get install -y clang-format-19
            clang-format-19 -i src/sr-event-dock.cpp
          fi
          git rm .github/workflows/apply-rubber-band-selection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sr-event-dock.cpp
          git commit -m 'feat: rubber-band select replay Events'
          git push origin HEAD:feature/hardware-zero-copy
