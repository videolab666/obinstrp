name: Apply replay event transitions

on:
  push:
    paths:
      - '.github/workflows/apply-event-transitions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0
      - name: Apply implementation patch
        run: python3 .github/scripts/apply-event-transitions.py
      - name: Format modified native sources
        run: |
          clang-format-19 -i \
            src/sr-config.h src/sr-config.c \
            src/sr-scene-tracker.h src/sr-scene-tracker.c \
            src/sr-replay-take.h src/sr-replay-take.c \
            src/sr-replay-playlist.h src/sr-replay-playlist.c \
            src/sr-dock.cpp src/sr-event-dock.cpp
          git diff --check
      - name: Commit implementation and remove helpers
        run: |
          rm -f .github/scripts/apply-event-transitions.py .github/workflows/apply-event-transitions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add vMix-style Event Transitions and angle sequences'
          git push origin HEAD:feature/hardware-zero-copy
