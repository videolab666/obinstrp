name: Upstream Cleanup Transform

on:
  push:
    branches:
      - release/upstream-cleanup-transform

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/upstream-cleanup-transform
          fetch-depth: 0
      - name: Apply cleanup
        run: |
          set -euo pipefail
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            exit 0
          fi
          python3 .github/scripts/upstream_cleanup_transform.py
          ! grep -R -n -E 'sr_config_(get|set)_save_dir|SR_PLAYBACK_ID|ram_bytes|saved MP4|loose-MP4|RAM instant replay buffer' src data/locale
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src data/locale
          git commit -m 'cleanup: remove obsolete RAM replay compatibility surface'
          git push origin HEAD:release/upstream-cleanup-transform
