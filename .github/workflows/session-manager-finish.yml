name: Session Manager Finish

on:
  push:
    branches:
      - feature/session-manager
    paths:
      - .github/workflows/session-manager-finish.yml

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply runtime hardening
        shell: python
        run: |
          from pathlib import Path

          panel = Path('src/sr-session-panel.cpp')
          p = panel.read_text(encoding='utf-8')
          if '#include <QHash>' not in p:
              p = p.replace('#include <QHeaderView>\n', '#include <QHeaderView>\n#include <QHash>\n', 1)

          old = 'connect(timer, &QTimer::timeout, this, [this]() { refresh(); });'
          new = 'connect(timer, &QTimer::timeout, this, [this]() { refresh(false); });'
          if old in p:
              p = p.replace(old, new, 1)
          elif new not in p:
              raise SystemExit('session timer refresh hook not found')

          old = '\tvoid refresh()\n\t{'
          new = '\tvoid refresh(bool rescanSizes = true)\n\t{'
          if old in p:
              p = p.replace(old, new, 1)
          elif new not in p:
              raise SystemExit('session refresh function not found')

          old = '''\t\t\tconst QString path = sessions.at(row).absoluteFilePath();\n\t\t\tconst QByteArray pathUtf8 = path.toUtf8();\n\t\t\tconst quint64 bytes = directoryBytes(path);\n\t\t\ttotalBytes += bytes;'''
          new = '''\t\t\tconst QString path = sessions.at(row).absoluteFilePath();\n\t\t\tconst QByteArray pathUtf8 = path.toUtf8();\n\t\t\tquint64 bytes = sessionSizeCache.value(path, 0);\n\t\t\tif (rescanSizes || !sessionSizeCache.contains(path)) {\n\t\t\t\tbytes = directoryBytes(path);\n\t\t\t\tsessionSizeCache.insert(path, bytes);\n\t\t\t}\n\t\t\ttotalBytes += bytes;'''
          if old in p:
              p = p.replace(old, new, 1)
          elif new not in p:
              raise SystemExit('session size calculation point not found')

          old = '\tQTimer *timer = nullptr;\n};'
          new = '\tQTimer *timer = nullptr;\n\tQHash<QString, quint64> sessionSizeCache;\n};'
          if old in p:
              p = p.replace(old, new, 1)
          elif new not in p:
              raise SystemExit('session cache member point not found')

          # Drop cached values as soon as physical sessions are deleted.
          old = '''\t\tfor (const QString &path : deletable) {\n\t\t\tif (QDir(path).removeRecursively())\n\t\t\t\tdeleted++;\n\t\t\telse\n\t\t\t\terrors++;\n\t\t}'''
          new = '''\t\tfor (const QString &path : deletable) {\n\t\t\tif (QDir(path).removeRecursively()) {\n\t\t\t\tsessionSizeCache.remove(path);\n\t\t\t\tdeleted++;\n\t\t\t} else {\n\t\t\t\terrors++;\n\t\t\t}\n\t\t}'''
          if old in p:
              p = p.replace(old, new, 1)
          elif new not in p:
              raise SystemExit('session delete cache point not found')
          panel.write_text(p, encoding='utf-8')

          session = Path('src/sr-session.c')
          s = session.read_text(encoding='utf-8')
          old = '''\t\tstruct sr_index_file_header header;\n\t\tif (fread(&header, 1, sizeof(header), file) == sizeof(header) &&\n\t\t    memcmp(header.magic, SR_INDEX_MAGIC, sizeof(header.magic)) == 0) {\n\t\t\tif (fseek(file, -(long)sizeof(struct sr_index_entry), SEEK_END) == 0) {\n\t\t\t\tstruct sr_index_entry entry;\n\t\t\t\tif (fread(&entry, 1, sizeof(entry), file) == sizeof(entry) && entry.timestamp_ns > current_max)\n\t\t\t\t\tcurrent_max = entry.timestamp_ns;\n\t\t\t}\n\t\t}'''
          new = '''\t\tstruct sr_index_file_header header;\n\t\tif (fread(&header, 1, sizeof(header), file) == sizeof(header) &&\n\t\t    memcmp(header.magic, SR_INDEX_MAGIC, sizeof(header.magic)) == 0 &&\n\t\t    header.version == SR_SEGMENT_FORMAT_VERSION && fseek(file, 0, SEEK_END) == 0) {\n\t\t\tconst long file_size = ftell(file);\n\t\t\tconst long minimum_size = (long)(sizeof(header) + sizeof(struct sr_index_entry));\n\t\t\tif (file_size >= minimum_size &&\n\t\t\t    fseek(file, -(long)sizeof(struct sr_index_entry), SEEK_END) == 0) {\n\t\t\t\tstruct sr_index_entry entry;\n\t\t\t\tif (fread(&entry, 1, sizeof(entry), file) == sizeof(entry) &&\n\t\t\t\t    entry.timestamp_ns > current_max)\n\t\t\t\t\tcurrent_max = entry.timestamp_ns;\n\t\t\t}\n\t\t}'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('index resume scan point not found')
          session.write_text(s, encoding='utf-8')

      - name: Install repository formatters
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap obsproject/tools
          if brew help trust >/dev/null 2>&1; then brew trust obsproject/tools; fi
          brew install --quiet obsproject/tools/clang-format@19 obsproject/tools/gersemi
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"

      - name: Format and validate
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          clang-format-19 -i src/sr-session-panel.cpp src/sr-session.c
          git diff --check

      - name: Commit runtime hardening
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sr-session-panel.cpp src/sr-session.c
          git commit -m "fix: harden session resume and storage UI refresh"
          git push origin HEAD:feature/session-manager
