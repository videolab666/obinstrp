name: Session Manager Finish

on:
  push:
    branches:
      - feature/session-manager
    paths:
      - .github/workflows/session-manager-finish.yml

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover interrupted recording runs
        shell: python
        run: |
          from pathlib import Path

          session = Path('src/sr-session.c')
          s = session.read_text(encoding='utf-8')
          function = '''static void recover_stale_recording_runs(const char *session_dir, uint64_t media_end_ns)\n{\n\tsqlite3 *sql = open_session_sqlite(session_dir);\n\tif (!sql)\n\t\treturn;\n\n\tsqlite3_stmt *stmt = NULL;\n\tconst char *query =\n\t\t"UPDATE recording_runs SET ended_unix=COALESCE(ended_unix,unixepoch()),"\n\t\t"timeline_end_ns=CASE WHEN timeline_end_ns IS NULL AND ? >= timeline_start_ns THEN ? "\n\t\t"ELSE timeline_end_ns END "\n\t\t"WHERE id=(SELECT id FROM recording_runs WHERE ended_unix IS NULL ORDER BY id DESC LIMIT 1)";\n\tbool recovered = false;\n\tif (sqlite3_prepare_v2(sql, query, -1, &stmt, NULL) == SQLITE_OK) {\n\t\tsqlite3_bind_int64(stmt, 1, (sqlite3_int64)media_end_ns);\n\t\tsqlite3_bind_int64(stmt, 2, (sqlite3_int64)media_end_ns);\n\t\tif (sqlite3_step(stmt) == SQLITE_DONE)\n\t\t\trecovered = sqlite3_changes(sql) > 0;\n\t}\n\tsqlite3_finalize(stmt);\n\n\t/* Older interrupted rows are historical bookkeeping only. Mark them closed\n\t * without inventing an OBS end timestamp or media end that we cannot prove. */\n\tchar *error = NULL;\n\tif (sqlite3_exec(sql,\n\t\t\t "UPDATE recording_runs SET ended_unix=COALESCE(ended_unix,unixepoch()) "\n\t\t\t "WHERE ended_unix IS NULL",\n\t\t\t NULL, NULL, &error) != SQLITE_OK) {\n\t\tblog(LOG_WARNING, "Pitel Instant Replay: could not close stale recording runs: %s",\n\t\t     error ? error : "unknown");\n\t}\n\tsqlite3_free(error);\n\tsqlite3_close(sql);\n\n\tif (recovered)\n\t\tblog(LOG_INFO, "Pitel Instant Replay: recovered an interrupted recording run at session %.3f s",\n\t\t     (double)media_end_ns / 1e9);\n}\n\n'''
          marker = 'static uint64_t frame_interval_ns(void)\n'
          if 'static void recover_stale_recording_runs(' not in s:
              if marker not in s:
                  raise SystemExit('stale-run helper insertion point not found')
              s = s.replace(marker, function + marker, 1)

          old = '''\tconst uint64_t previous_end = last_media_timestamp(g_recording_path);\n\tg_recording_discontinuity = previous_end != 0;'''
          new = '''\tconst uint64_t previous_end = last_media_timestamp(g_recording_path);\n\trecover_stale_recording_runs(g_recording_path, previous_end);\n\tg_recording_discontinuity = previous_end != 0;'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('stale-run recovery call insertion point not found')
          session.write_text(s, encoding='utf-8')

      - name: Install repository formatter
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap obsproject/tools
          if brew help trust >/dev/null 2>&1; then brew trust obsproject/tools; fi
          brew install --quiet obsproject/tools/clang-format@19
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"

      - name: Format and validate
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          clang-format-19 -i src/sr-session.c
          git diff --check

      - name: Commit recovery hardening
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sr-session.c
          git commit -m "fix: recover interrupted session recording runs"
          git push origin HEAD:feature/session-manager
