name: Prerelease Docs Cleanup

on:
  push:
    branches:
      - release/prerelease-doc-cleanup

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/prerelease-doc-cleanup
          fetch-depth: 0
      - name: Apply docs cleanup
        run: |
          set -euo pipefail
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            exit 0
          fi
          python3 .github/scripts/prerelease_docs_cleanup.py
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'docs: remove prerelease compatibility assumptions'
          git push origin HEAD:release/prerelease-doc-cleanup
