name: One-shot short-GOP playback integration

on:
  push:
    branches:
      - feature/disk-replay-core
    paths:
      - '.github/workflows/integrate-replay-decode-once.yaml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0

      - name: Integrate keyframe-aware RAM replay decode
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/playback-source.c')
          text = path.read_text(encoding='utf-8')

          old_include = '#include "sr-codec.h"\n#include "sr-capture.h"'
          new_include = '#include "sr-codec.h"\n#include "sr-replay-decode.h"\n#include "sr-capture.h"'
          if old_include not in text:
              raise SystemExit('expected include anchor not found')
          text = text.replace(old_include, new_include, 1)

          old_func = '''static void sr_playback_output_frame_at(struct sr_playback *p, size_t idx)
          {
          \tif (!p->decoder || idx >= p->replay.video.num)
          \t\treturn;

          \t/* all frames are intra frames: a non-sequential jump only needs a
          \t * decoder flush, not decoding from a keyframe */
          \tif (p->cur_idx >= 0 && (size_t)(p->cur_idx + 1) != idx)
          \t\tsr_decoder_flush(p->decoder);

          \tAVFrame *decoded = NULL;
          \tif (!sr_decoder_decode(p->decoder, p->replay.video.array[idx].pkt, &decoded))
          \t\treturn;

          \toutput_avframe(p, decoded);
          \tp->cur_idx = (int64_t)idx;
          }
          '''

          new_func = '''static void sr_playback_output_frame_at(struct sr_playback *p, size_t idx)
          {
          \tif (!p->decoder || idx >= p->replay.video.num)
          \t\treturn;

          \t/* Short-GOP packets after an IDR depend on earlier reference frames.
          \t * The helper keeps the decoder warm during normal forward playback,
          \t * decodes skipped packets on fast-forward, and for reverse/random
          \t * seeks flushes and rebuilds state from the preceding keyframe. */
          \tAVFrame *decoded = NULL;
          \tif (!sr_replay_decode_frame_at(p->decoder, &p->replay, &p->cur_idx, idx, &decoded))
          \t\treturn;

          \toutput_avframe(p, decoded);
          }
          '''

          if old_func not in text:
              raise SystemExit('expected sr_playback_output_frame_at body not found')
          text = text.replace(old_func, new_func, 1)

          old_comment = '\tint64_t cur_idx; /* index of last decoded/output video packet */'
          new_comment = '\tint64_t cur_idx; /* index of last packet represented in decoder reference state */'
          if old_comment not in text:
              raise SystemExit('expected cur_idx comment not found')
          text = text.replace(old_comment, new_comment, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install clang-format
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew tap obsproject/tools
          brew install --quiet obsproject/tools/clang-format@19
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"

      - name: Format playback source
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./build-aux/run-clang-format src/playback-source.c

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/playback-source.c
          git commit -m "feat: make RAM replay playback short-GOP aware"
          git push origin HEAD:feature/disk-replay-core
