name: One-shot short-GOP encoder presets

on:
  push:
    branches:
      - feature/disk-replay-core
    paths:
      - '.github/workflows/enable-short-gop-once.yaml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0

      - name: Add replay GOP presets and switch Balanced to 0.5 s
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: expected anchor not found: {label}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          # sr-codec.h: public internal API and preset constants.
          replace_once(
              'src/sr-codec.h',
              '''enum sr_encoder_backend {
          \tSR_ENC_AUTO = 0,
          \tSR_ENC_NVENC,
          \tSR_ENC_AMF,
          \tSR_ENC_QSV,
          \tSR_ENC_X264,
          };
          ''',
              '''enum sr_encoder_backend {
          \tSR_ENC_AUTO = 0,
          \tSR_ENC_NVENC,
          \tSR_ENC_AMF,
          \tSR_ENC_QSV,
          \tSR_ENC_X264,
          };

          enum sr_gop_interval {
          \tSR_GOP_ALL_I = 0,
          \tSR_GOP_250MS = 250,
          \tSR_GOP_500MS = 500,
          \tSR_GOP_1000MS = 1000,
          };
          ''',
              'gop enum')

          replace_once(
              'src/sr-codec.h',
              '''/* Creates an all-intra H.264 encoder. Tries hardware encoders first when
           * backend is SR_ENC_AUTO and falls back to libx264. Returns NULL only if
           * no encoder could be opened at all. qp: 0 (best) .. 51 (worst). */
          struct sr_encoder *sr_encoder_create(uint32_t width, uint32_t height, uint32_t fps_num, uint32_t fps_den,
          \t\t\t\t     enum sr_encoder_backend backend, int qp);
          ''',
              '''/* Creates a replay-optimized H.264 encoder. Tries hardware encoders first
           * when backend is SR_ENC_AUTO and falls back to libx264. GOP is expressed
           * in milliseconds; SR_GOP_ALL_I keeps one keyframe per frame. B-frames are
           * always disabled and GOPs are requested as closed for deterministic seek.
           * qp: 0 (best) .. 51 (worst). */
          struct sr_encoder *sr_encoder_create(uint32_t width, uint32_t height, uint32_t fps_num, uint32_t fps_den,
          \t\t\t\t     enum sr_encoder_backend backend, int qp, uint32_t gop_interval_ms);
          ''',
              'encoder declaration')

          replace_once(
              'src/sr-codec.h',
              '''/* Software decoder for the stored all-intra stream. extradata may be NULL. */''',
              '''/* Software decoder for the stored H.264 replay stream. extradata may be NULL. */''',
              'decoder comment')

          # sr-codec.c: calculate frame GOP from the OBS rational frame rate.
          replace_once(
              'src/sr-codec.c',
              '''#include <libavutil/imgutils.h>
          #include <libswscale/swscale.h>
          ''',
              '''#include <libavutil/imgutils.h>
          #include <libswscale/swscale.h>

          #include <limits.h>
          ''',
              'limits include')

          replace_once(
              'src/sr-codec.c',
              '''static bool open_encoder(struct sr_encoder *enc, const char *name, uint32_t width, uint32_t height, uint32_t fps_num,
          \t\t\t uint32_t fps_den, int qp)
          {''',
              '''static int gop_frames_from_interval(uint32_t fps_num, uint32_t fps_den, uint32_t gop_interval_ms)
          {
          \tif (!gop_interval_ms || !fps_num || !fps_den)
          \t\treturn 1;

          \tconst uint64_t numerator = (uint64_t)fps_num * (uint64_t)gop_interval_ms;
          \tconst uint64_t denominator = (uint64_t)fps_den * 1000ULL;
          \tuint64_t frames = (numerator + denominator / 2ULL) / denominator;
          \tif (!frames)
          \t\tframes = 1;
          \tif (frames > (uint64_t)INT_MAX)
          \t\tframes = (uint64_t)INT_MAX;
          \treturn (int)frames;
          }

          static bool open_encoder(struct sr_encoder *enc, const char *name, uint32_t width, uint32_t height, uint32_t fps_num,
          \t\t\t uint32_t fps_den, int qp, int gop_size)
          {''',
              'gop conversion and open_encoder signature')

          replace_once(
              'src/sr-codec.c',
              '''\t/* every frame is an intra frame so the replay can start playback and
          \t * scrub at any position without decoding predecessors */
          \tctx->width = (int)(width & ~1u);
          \tctx->height = (int)(height & ~1u);
          \tctx->pix_fmt = AV_PIX_FMT_NV12;
          \tctx->time_base = (AVRational){(int)fps_den, (int)fps_num};
          \tctx->framerate = (AVRational){(int)fps_num, (int)fps_den};
          \tctx->gop_size = 1;
          \tctx->max_b_frames = 0;
          \t/* emit SPS/PPS as out-of-band extradata so the stream can be muxed to
          \t * mp4 and decoded from a stored header */
          \tctx->flags |= AV_CODEC_FLAG_GLOBAL_HEADER;
          ''',
              '''\t/* Replay streams use a short closed GOP with no B-frames. That keeps
          \t * packet order equal to presentation order while still reducing RAM/disk
          \t * bandwidth dramatically versus All-I. The playback paths rebuild codec
          \t * state from the preceding keyframe for random/reverse seeks. */
          \tctx->width = (int)(width & ~1u);
          \tctx->height = (int)(height & ~1u);
          \tctx->pix_fmt = AV_PIX_FMT_NV12;
          \tctx->time_base = (AVRational){(int)fps_den, (int)fps_num};
          \tctx->framerate = (AVRational){(int)fps_num, (int)fps_den};
          \tctx->gop_size = gop_size > 0 ? gop_size : 1;
          \tctx->max_b_frames = 0;
          \t/* emit SPS/PPS as out-of-band extradata so the stream can be muxed to
          \t * mp4 and decoded from a stored header */
          \tctx->flags |= AV_CODEC_FLAG_GLOBAL_HEADER | AV_CODEC_FLAG_CLOSED_GOP;
          ''',
              'encoder GOP policy')

          replace_once(
              'src/sr-codec.c',
              '''struct sr_encoder *sr_encoder_create(uint32_t width, uint32_t height, uint32_t fps_num, uint32_t fps_den,
          \t\t\t\t     enum sr_encoder_backend backend, int qp)
          {
          \tstatic const char *auto_order[] = {"h264_nvenc", "h264_amf", "h264_qsv", "libx264"};
          \tconst char *only = NULL;
          ''',
              '''struct sr_encoder *sr_encoder_create(uint32_t width, uint32_t height, uint32_t fps_num, uint32_t fps_den,
          \t\t\t\t     enum sr_encoder_backend backend, int qp, uint32_t gop_interval_ms)
          {
          \tstatic const char *auto_order[] = {"h264_nvenc", "h264_amf", "h264_qsv", "libx264"};
          \tconst char *only = NULL;
          \tconst int gop_size = gop_frames_from_interval(fps_num, fps_den, gop_interval_ms);
          ''',
              'encoder create signature')

          p = Path('src/sr-codec.c')
          text = p.read_text(encoding='utf-8')
          old_calls = [
              'open_encoder(enc, only, width, height, fps_num, fps_den, qp)',
              'open_encoder(enc, "libx264", width, height, fps_num, fps_den, qp)',
              'open_encoder(enc, auto_order[i], width, height, fps_num, fps_den, qp)',
          ]
          new_calls = [
              'open_encoder(enc, only, width, height, fps_num, fps_den, qp, gop_size)',
              'open_encoder(enc, "libx264", width, height, fps_num, fps_den, qp, gop_size)',
              'open_encoder(enc, auto_order[i], width, height, fps_num, fps_den, qp, gop_size)',
          ]
          for old, new in zip(old_calls, new_calls):
              if old not in text:
                  raise SystemExit(f'src/sr-codec.c: expected encoder call not found: {old}')
              text = text.replace(old, new, 1)
          old_log = '''\tobs_log(LOG_INFO, "opened replay encoder '%s' (%ux%u, qp %d)", enc->codec->name, enc->ctx->width,
          \t\tenc->ctx->height, qp);'''
          new_log = '''\tconst double actual_gop_ms = 1000.0 * (double)gop_size * (double)fps_den / (double)fps_num;
          \tobs_log(LOG_INFO, "opened replay encoder '%s' (%ux%u, qp %d, GOP %d frames / %.1f ms, B=0)",
          \t\tenc->codec->name, enc->ctx->width, enc->ctx->height, qp, gop_size, actual_gop_ms);'''
          if old_log not in text:
              raise SystemExit('src/sr-codec.c: encoder log anchor not found')
          text = text.replace(old_log, new_log, 1)
          p.write_text(text, encoding='utf-8')

          # Capture-filter property, reset semantics and 0.5 s default.
          replace_once(
              'src/capture-filter.c',
              '''#define S_ENCODER "encoder"
          #define S_QUALITY "quality"
          #define S_DISK_RECORDING "disk_recording"
          ''',
              '''#define S_ENCODER "encoder"
          #define S_QUALITY "quality"
          #define S_GOP "gop_ms"
          #define S_DISK_RECORDING "disk_recording"
          ''',
              'gop setting key')

          replace_once(
              'src/capture-filter.c',
              '''\tenum sr_encoder_backend backend;
          \tint qp;
          \tbool disk_recording;
          ''',
              '''\tenum sr_encoder_backend backend;
          \tint qp;
          \tuint32_t gop_ms;
          \tbool disk_recording;
          ''',
              'capture gop field')

          replace_once(
              'src/capture-filter.c',
              '''\tconst enum sr_encoder_backend backend = (enum sr_encoder_backend)obs_data_get_int(settings, S_ENCODER);
          \tconst int qp = (int)obs_data_get_int(settings, S_QUALITY);
          \tconst bool disk_recording = obs_data_get_bool(settings, S_DISK_RECORDING);

          \tif (backend != c->backend || qp != c->qp) {
          \t\tc->backend = backend;
          \t\tc->qp = qp;
          ''',
              '''\tconst enum sr_encoder_backend backend = (enum sr_encoder_backend)obs_data_get_int(settings, S_ENCODER);
          \tconst int qp = (int)obs_data_get_int(settings, S_QUALITY);
          \tuint32_t gop_ms = (uint32_t)obs_data_get_int(settings, S_GOP);
          \tif (gop_ms != SR_GOP_ALL_I && gop_ms != SR_GOP_250MS && gop_ms != SR_GOP_500MS &&
          \t    gop_ms != SR_GOP_1000MS)
          \t\tgop_ms = SR_GOP_500MS;
          \tconst bool disk_recording = obs_data_get_bool(settings, S_DISK_RECORDING);

          \tif (backend != c->backend || qp != c->qp || gop_ms != c->gop_ms) {
          \t\tc->backend = backend;
          \t\tc->qp = qp;
          \t\tc->gop_ms = gop_ms;
          ''',
              'capture update')

          replace_once(
              'src/capture-filter.c',
              '''\tc->backend = SR_ENC_AUTO;
          \tc->qp = 23;
          \tsr_capture_update(c, settings);
          ''',
              '''\tc->backend = SR_ENC_AUTO;
          \tc->qp = 23;
          \tc->gop_ms = SR_GOP_500MS;
          \tsr_capture_update(c, settings);
          ''',
              'capture create default')

          replace_once(
              'src/capture-filter.c',
              '''\t\tc->encoder =
          \t\t\tsr_encoder_create(frame->width, frame->height, ovi.fps_num, ovi.fps_den, c->backend, c->qp);
          ''',
              '''\t\tc->encoder = sr_encoder_create(frame->width, frame->height, ovi.fps_num, ovi.fps_den, c->backend,
          \t\t\t\t\t       c->qp, c->gop_ms);
          ''',
              'encoder create call')

          replace_once(
              'src/capture-filter.c',
              '''\tobs_property_list_add_int(p, obs_module_text("Quality.Low"), 28);

          \tp = obs_properties_add_bool(props, S_DISK_RECORDING, obs_module_text("DiskRecording"));
          ''',
              '''\tobs_property_list_add_int(p, obs_module_text("Quality.Low"), 28);

          \tp = obs_properties_add_list(props, S_GOP, obs_module_text("GOP"), OBS_COMBO_TYPE_LIST,
          \t\t\t\t    OBS_COMBO_FORMAT_INT);
          \tobs_property_list_add_int(p, obs_module_text("GOP.AllI"), SR_GOP_ALL_I);
          \tobs_property_list_add_int(p, obs_module_text("GOP.Ultra"), SR_GOP_250MS);
          \tobs_property_list_add_int(p, obs_module_text("GOP.Balanced"), SR_GOP_500MS);
          \tobs_property_list_add_int(p, obs_module_text("GOP.Economy"), SR_GOP_1000MS);
          \tobs_property_set_long_description(p, obs_module_text("GOP.Description"));

          \tp = obs_properties_add_bool(props, S_DISK_RECORDING, obs_module_text("DiskRecording"));
          ''',
              'gop property')

          replace_once(
              'src/capture-filter.c',
              '''\tobs_data_set_default_int(settings, S_ENCODER, SR_ENC_AUTO);
          \tobs_data_set_default_int(settings, S_QUALITY, 23);
          ''',
              '''\tobs_data_set_default_int(settings, S_ENCODER, SR_ENC_AUTO);
          \tobs_data_set_default_int(settings, S_QUALITY, 23);
          \tobs_data_set_default_int(settings, S_GOP, SR_GOP_500MS);
          ''',
              'gop default')

          # Remove obsolete all-intra wording in the RAM buffer and writer comments.
          replace_once(
              'src/sr-buffer.h',
              '''/* One encoded video frame kept in the ring buffer. Because every frame is
           * encoded as an intra frame, any packet can be decoded on its own. */''',
              '''/* One encoded video frame kept in the ring buffer. AV_PKT_FLAG_KEY marks
           * frames that can seed an independent decode chain. */''',
              'buffer packet comment')

          replace_once(
              'src/sr-segment-writer.c',
              '''\t/* Make the active .part reasonably current for the future live reader
          \t * without flushing every frame. With the current All-I encoder this is
          \t * approximately twice per second; with short GOP it follows keyframes. */''',
              '''\t/* Make the active .part reasonably current for the live reader without
          \t * flushing every frame. Flush at most twice per second and only on a
          \t * keyframe, so the visible index always advances at a safe decode point. */''',
              'writer flush comment')

          # Locale strings.
          replace_once(
              'data/locale/en-US.ini',
              '''Quality.Low="Low"
          DiskRecording="Continuous replay recording to disk"
          ''',
              '''Quality.Low="Low"
          GOP="Keyframe interval (GOP)"
          GOP.Description="Balanced 0.5 s is recommended. Shorter GOP improves reverse, jog and random seek responsiveness but increases bitrate and storage at the same quality. B-frames stay disabled."
          GOP.AllI="All-I (every frame is a keyframe)"
          GOP.Ultra="0.25 s — Ultra Replay"
          GOP.Balanced="0.50 s — Balanced (recommended)"
          GOP.Economy="1.00 s — Economy"
          DiskRecording="Continuous replay recording to disk"
          ''',
              'English GOP locale')

          replace_once(
              'data/locale/es-ES.ini',
              '''Quality.Low="Baja"
          CaptureSource="Capturar desde la fuente"
          ''',
              '''Quality.Low="Baja"
          GOP="Intervalo de fotograma clave (GOP)"
          GOP.Description="Se recomienda Balanced de 0,5 s. Un GOP más corto mejora la respuesta al retroceso, jog y búsqueda aleatoria, pero aumenta el bitrate y el almacenamiento con la misma calidad. Los B-frames permanecen desactivados."
          GOP.AllI="All-I (cada cuadro es un fotograma clave)"
          GOP.Ultra="0,25 s — Ultra Replay"
          GOP.Balanced="0,50 s — Balanced (recomendado)"
          GOP.Economy="1,00 s — Economy"
          CaptureSource="Capturar desde la fuente"
          ''',
              'Spanish GOP locale')
          PY

      - name: Install clang-format
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew tap obsproject/tools
          brew install --quiet obsproject/tools/clang-format@19
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"

      - name: Format C sources
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./build-aux/run-clang-format \
            src/sr-codec.c \
            src/sr-codec.h \
            src/capture-filter.c \
            src/sr-buffer.h \
            src/sr-segment-writer.c

      - name: Commit short-GOP presets
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src data/locale
          git commit -m "feat: add short-GOP replay encoder presets"
          git push origin HEAD:feature/disk-replay-core
