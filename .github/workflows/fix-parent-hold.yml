name: Fix parent hold lifetime

on:
  push:
    branches:
      - feature/hardware-zero-copy
    paths:
      - .github/workflows/fix-parent-hold.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0
      - name: Apply parent lifetime fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/capture-filter.c')
          s = p.read_text()
          old = '''\tobs_source_t *parent = obs_filter_get_parent(c->self);
          \tif (!parent)
          \t\treturn;
          \tif (hold)
          \t\tobs_source_inc_showing(parent);
          \telse
          \t\tobs_source_dec_showing(parent);
          \tc->parent_showing_held = hold;'''
          new = '''\tobs_source_t *parent = sr_capture_parent_ref(c);
          \tif (!parent)
          \t\treturn;
          \tif (hold)
          \t\tobs_source_inc_showing(parent);
          \telse
          \t\tobs_source_dec_showing(parent);
          \tc->parent_showing_held = hold;
          \tobs_source_release(parent);'''
          assert old in s, 'parent showing helper changed unexpectedly'
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-parent-hold.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/capture-filter.c
          git diff --cached --check
          git commit -m "fix: keep capture parent lifetime valid"
          git push origin HEAD:feature/hardware-zero-copy
