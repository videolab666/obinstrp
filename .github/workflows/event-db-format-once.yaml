name: One-shot EventDB formatting

on:
  push:
    branches:
      - feature/disk-replay-core
    paths:
      - '.github/workflows/event-db-format-once.yaml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0

      - name: Apply small EventDB correctness cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/sr-event-db.c')
          text = p.read_text(encoding='utf-8')
          if '#include <stdio.h>' not in text:
              text = text.replace('#include <math.h>\n#include <string.h>', '#include <math.h>\n#include <stdio.h>\n#include <string.h>', 1)

          old = '''bool sr_event_db_set_event_position(struct sr_event_db *db, unsigned list_id, uint64_t event_id, int position)
          {
          \tif (!db || !valid_list_id(list_id) || !event_id || !valid_u64(event_id))
          \t\treturn false;

          \tpthread_mutex_lock(&db->mutex);
          \tint old_position = -1;
          \tbool found = false;
          \tbool ok = list_position_locked(db, list_id, event_id, &old_position, &found) && found && begin_transaction(db);
          \tif (ok)
          \t\tok = reorder_existing_locked(db, list_id, event_id, old_position, position);
          \tif (ok)
          \t\tok = commit_transaction(db);
          \telse if (found)
          \t\trollback_transaction(db);
          \tpthread_mutex_unlock(&db->mutex);
          \treturn ok;
          }
          '''
          new = '''bool sr_event_db_set_event_position(struct sr_event_db *db, unsigned list_id, uint64_t event_id, int position)
          {
          \tif (!db || !valid_list_id(list_id) || !event_id || !valid_u64(event_id))
          \t\treturn false;

          \tpthread_mutex_lock(&db->mutex);
          \tint old_position = -1;
          \tbool found = false;
          \tif (!list_position_locked(db, list_id, event_id, &old_position, &found) || !found) {
          \t\tpthread_mutex_unlock(&db->mutex);
          \t\treturn false;
          \t}
          \tif (!begin_transaction(db)) {
          \t\tpthread_mutex_unlock(&db->mutex);
          \t\treturn false;
          \t}

          \tbool ok = reorder_existing_locked(db, list_id, event_id, old_position, position);
          \tif (ok)
          \t\tok = commit_transaction(db);
          \telse
          \t\trollback_transaction(db);
          \tpthread_mutex_unlock(&db->mutex);
          \treturn ok;
          }
          '''
          if old not in text:
              raise SystemExit('set_event_position anchor not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install formatters
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew tap obsproject/tools
          brew install --quiet obsproject/tools/clang-format@19 obsproject/tools/gersemi
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"

      - name: Format EventDB sources and CMake
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./build-aux/run-clang-format src/sr-event-db.c src/sr-event-db.h
          ./build-aux/run-gersemi CMakeLists.txt

      - name: Commit formatted EventDB foundation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/sr-event-db.c src/sr-event-db.h
          git commit -m "style: format SQLite EventDB foundation"
          git push origin HEAD:feature/disk-replay-core
