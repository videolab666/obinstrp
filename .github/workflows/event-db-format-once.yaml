name: One-shot EventDB formatting

on:
  push:
    branches:
      - feature/disk-replay-core
    paths:
      - '.github/workflows/event-db-format-once.yaml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0

      - name: Apply EventDB build fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          event_db = Path('src/sr-event-db.c')
          text = event_db.read_text(encoding='utf-8')
          text = text.replace('obs_log(', 'blog(')
          event_db.write_text(text, encoding='utf-8')

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text(encoding='utf-8')
          old = 'set_target_properties(sr_sqlite PROPERTIES POSITION_INDEPENDENT_CODE ON C_VISIBILITY_PRESET hidden)\n'
          new = '''set_target_properties(
            sr_sqlite
            PROPERTIES POSITION_INDEPENDENT_CODE ON C_VISIBILITY_PRESET hidden COMPILE_WARNING_AS_ERROR OFF
          )
          if(MSVC)
            target_compile_options(sr_sqlite PRIVATE /W0)
          else()
            target_compile_options(sr_sqlite PRIVATE -w)
          endif()
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'COMPILE_WARNING_AS_ERROR OFF' not in text:
              raise SystemExit('sr_sqlite target-properties anchor not found')
          cmake.write_text(text, encoding='utf-8')
          PY

      - name: Install formatters
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew tap obsproject/tools
          brew install --quiet obsproject/tools/clang-format@19 obsproject/tools/gersemi
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"

      - name: Format EventDB sources and CMake
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./build-aux/run-clang-format src/sr-event-db.c src/sr-event-db.h
          ./build-aux/run-gersemi CMakeLists.txt

      - name: Commit EventDB build fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/sr-event-db.c src/sr-event-db.h
          git commit -m "fix: make SQLite EventDB build cleanly"
          git push origin HEAD:feature/disk-replay-core
