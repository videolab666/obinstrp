name: Apply bulk delete and playlist timeline fix
on:
  push:
    branches: [feature/hardware-zero-copy]
    paths:
      - '.github/scripts/patch-bulk-delete-playlist-timeline.py'
      - '.github/workflows/apply-bulk-delete-playlist-timeline.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
      - name: Fix helper indentation and apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/patch-bulk-delete-playlist-timeline.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("'\\tauto *protect = new QPushButton(T(\"EventDock.Protect\"), this);\\n\\tauto *remove = new QPushButton(T(\"EventDock.Delete\"), this);'", "'\\t\\tauto *protect = new QPushButton(T(\"EventDock.Protect\"), this);\\n\\t\\tauto *remove = new QPushButton(T(\"EventDock.Delete\"), this);'")
          s = s.replace("'\\tauto *protect = new QPushButton(T(\"EventDock.Protect\"), this);\\n\\tprotect->setToolTip(T(\"EventDock.Protect.Tooltip\"));\\n\\tauto *remove = new QPushButton(T(\"EventDock.Delete\"), this);'", "'\\t\\tauto *protect = new QPushButton(T(\"EventDock.Protect\"), this);\\n\\t\\tprotect->setToolTip(T(\"EventDock.Protect.Tooltip\"));\\n\\t\\tauto *remove = new QPushButton(T(\"EventDock.Delete\"), this);'")
          p.write_text(s, encoding='utf-8')
          PY
          python3 .github/scripts/patch-bulk-delete-playlist-timeline.py
      - name: Format sources
        run: |
          clang-format -i src/sr-event-dock.cpp src/sr-replay-playlist.c src/sr-replay-playlist.h
      - name: Validate key behavior
        run: |
          grep -q 'selectedEventIds()' src/sr-event-dock.cpp
          grep -q 'sr_replay_playlist_snapshot_items' src/sr-event-dock.cpp
          grep -q 'EventDock.Timeline.PlaylistTooltip' data/locale/en-US.ini
          ! grep -A120 'void deleteSelected' src/sr-event-dock.cpp | grep -q 'QMessageBox::question'
      - name: Commit product changes and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sr-event-dock.cpp src/sr-replay-playlist.c src/sr-replay-playlist.h data/locale/en-US.ini data/locale/es-ES.ini
          git rm -f .github/scripts/patch-bulk-delete-playlist-timeline.py .github/workflows/apply-bulk-delete-playlist-timeline.yml
          git commit -m 'fix: bulk delete and sequence timeline progress'
          git push origin HEAD:feature/hardware-zero-copy
