name: One-shot UUID camera storage

on:
  push:
    branches:
      - feature/disk-replay-core
    paths:
      - '.github/workflows/apply-camera-uuid-storage-once.yaml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0
      - name: Apply UUID camera storage
        run: python3 .github/scripts/apply_camera_uuid_storage.py
      - name: Install formatters
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew tap obsproject/tools
          brew install --quiet obsproject/tools/clang-format@19
          brew install --quiet obsproject/tools/gersemi
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"
      - name: Format and commit
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./build-aux/run-clang-format src/sr-camera-identity.c src/sr-camera-identity.h src/capture-filter.c src/sr-segment-writer.c src/sr-segment-writer.h src/sr-segment-catalog.c
          ./build-aux/run-gersemi CMakeLists.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/sr-camera-identity.c src/sr-camera-identity.h src/capture-filter.c src/sr-segment-writer.c src/sr-segment-writer.h src/sr-segment-catalog.c
          git diff --cached --check
          git commit -m "feat: key replay camera storage by OBS UUID"
          git push origin HEAD:feature/disk-replay-core
