name: Apply Pitel branding and thumbnail fix

on:
  push:
    branches: [feature/hardware-zero-copy]
    paths:
      - '.github/workflows/apply-pitel-branding-thumbnails.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
      - name: Apply product patch
        run: python3 .github/scripts/patch-pitel-branding-thumbnails.py
      - name: Format sources
        run: |
          clang-format -i \
            src/sr-thumb.c src/sr-config.c src/sr-dock.cpp \
            src/sr-segment-writer.c src/sr-master-audio.c src/sr-storage-manager.c \
            src/sr-event-output.c src/capture-filter.c src/playback-source.c src/sr-credit.h
      - name: Validate patch
        run: |
          python3 -m json.tool buildspec.json >/dev/null
          git diff --check
          test "$(python3 -c 'import json; print(json.load(open("buildspec.json"))["name"])')" = "pitel-instant-replay"
          grep -q 'av_hwframe_transfer_data' src/sr-thumb.c
      - name: Commit product changes and remove helpers
        shell: bash
        run: |
          rm -f .github/scripts/patch-pitel-branding-thumbnails.py .github/workflows/apply-pitel-branding-thumbnails.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore thumbnails and rename plugin module'
          git push origin HEAD:feature/hardware-zero-copy
