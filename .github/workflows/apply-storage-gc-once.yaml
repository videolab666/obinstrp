name: One-shot apply storage GC checkpoint

on:
  push:
    branches:
      - feature/disk-replay-core
    paths:
      - '.github/workflows/apply-storage-gc-once.yaml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0

      - name: Apply storage GC implementation
        run: python3 .github/scripts/apply_storage_gc.py

      - name: Install formatting tools
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew tap obsproject/tools
          brew install --quiet obsproject/tools/clang-format@19 gersemi
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"

      - name: Format and commit
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./build-aux/run-clang-format \
            src/sr-media-guard.c \
            src/sr-media-guard.h \
            src/sr-storage-cleanup.c \
            src/sr-storage-cleanup.h \
            src/sr-config.c \
            src/sr-config.h \
            src/sr-event-controller.c \
            src/sr-segment-writer.c \
            src/sr-segment-writer.h \
            src/capture-filter.c \
            src/sr-dock.cpp
          gersemi -i CMakeLists.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CMakeLists.txt \
            src/sr-media-guard.c \
            src/sr-media-guard.h \
            src/sr-storage-cleanup.c \
            src/sr-storage-cleanup.h \
            src/sr-config.c \
            src/sr-config.h \
            src/sr-event-controller.c \
            src/sr-segment-writer.c \
            src/sr-segment-writer.h \
            src/capture-filter.c \
            src/sr-dock.cpp \
            data/locale/en-US.ini \
            data/locale/es-ES.ini \
            docs/STORAGE_GC_STATUS.md
          if git diff --cached --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git commit -m "feat: add automatic storage GC hysteresis"
          git push origin HEAD:feature/disk-replay-core
