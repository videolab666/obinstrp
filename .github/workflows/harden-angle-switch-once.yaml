name: One-shot angle switch commit hardening

on:
  push:
    branches: [feature/disk-replay-core]
    paths:
      - '.github/workflows/harden-angle-switch-once.yaml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0

      - name: Apply angle switch hardening
        run: python3 .github/scripts/harden_angle_switch.py

      - name: Install clang-format
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew install --quiet obsproject/tools/clang-format@19
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"

      - name: Format changed source
        shell: zsh --no-rcs --errexit --pipefail {0}
        run: |
          ./build-aux/run-clang-format src/plugin-main.c src/sr-replay-channel.c

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plugin-main.c src/sr-replay-channel.c
          git diff --cached --check
          git commit -m "fix: validate replay angle at commit-time playhead"
          git push origin HEAD:feature/disk-replay-core
