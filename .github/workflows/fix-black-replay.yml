name: Fix black replay GPU path

on:
  push:
    branches:
      - feature/hardware-zero-copy
    paths:
      - .github/workflows/fix-black-replay.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0
      - name: Apply OBS render-contract fixes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/fix_black_replay.py
          git rm .github/workflows/fix-black-replay.yml .github/scripts/fix_black_replay.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sr-event-output.c src/capture-filter.c
          git diff --cached --check
          git commit -m "fix: restore replay video rendering"
          git push origin HEAD:feature/hardware-zero-copy
