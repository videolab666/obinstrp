name: Format hardware status files

on:
  push:
    branches:
      - feature/hardware-zero-copy
    paths:
      - .github/workflows/format-hardware-status.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0
      - name: Run project clang-format 19
        shell: bash
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet obsproject/tools/clang-format@19
          clang-format-19 -i src/capture-filter.c src/sr-disk-player.h src/sr-event-dock.cpp
          git rm .github/workflows/format-hardware-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/capture-filter.c src/sr-disk-player.h src/sr-event-dock.cpp
          git diff --cached --check
          git commit -m "style: format hardware performance status"
          git push origin HEAD:feature/hardware-zero-copy
