name: One-shot replay angle coverage UI integration

on:
  push:
    branches: [feature/disk-replay-core]
    paths:
      - '.github/workflows/apply-angle-coverage-ui-once.yaml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0

      - name: Apply angle coverage integration
        run: python3 .github/scripts/apply_angle_coverage_ui.py

      - name: Install formatters
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew install --quiet obsproject/tools/clang-format@19
          brew install --quiet obsproject/tools/gersemi
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"

      - name: Format changed source
        shell: zsh --no-rcs --errexit --pipefail {0}
        run: |
          ./build-aux/run-clang-format src/sr-replay-coverage.c src/sr-replay-coverage.h src/sr-event-dock.cpp
          ./build-aux/run-gersemi CMakeLists.txt

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt data/locale/en-US.ini src/sr-replay-coverage.c src/sr-replay-coverage.h src/sr-event-dock.cpp
          git diff --cached --check
          git commit -m "feat: add dedicated replay angle coverage controls"
          git push origin HEAD:feature/disk-replay-core
