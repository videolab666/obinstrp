name: Apply vMix-style operator UI

on:
  push:
    paths:
      - '.github/workflows/apply-vmix-operator-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0
      - name: Apply operator UI patch
        run: python .github/scripts/patch-vmix-ui.py
      - name: Format C++ with CI clang-format
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew tap obsproject/tools
          brew install --quiet obsproject/tools/clang-format@19
          /home/linuxbrew/.linuxbrew/opt/clang-format@19/bin/clang-format-19 -style=file -fallback-style=none -i src/sr-event-dock.cpp
      - name: Commit patch and remove helpers
        shell: bash
        run: |
          rm -f .github/workflows/apply-vmix-operator-ui.yml .github/scripts/patch-vmix-ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sr-event-dock.cpp data/locale/en-US.ini data/locale/es-ES.ini .github/workflows/apply-vmix-operator-ui.yml .github/scripts/patch-vmix-ui.py
          git commit -m "feat: vMix-style compact replay operator UI"
          git push origin HEAD:feature/hardware-zero-copy
