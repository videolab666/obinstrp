name: One-shot stinger return lifecycle hardening

on:
  push:
    branches:
      - feature/disk-replay-core
    paths:
      - '.github/workflows/harden-stinger-return-once.yaml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0

      - name: Apply hardening
        run: python3 .github/scripts/harden_stinger_return.py

      - name: Install clang-format 19
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew tap obsproject/tools
          brew install --quiet obsproject/tools/clang-format@19
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"

      - name: Format changed sources
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./build-aux/run-clang-format \
            src/sr-event-output.c \
            src/sr-replay-take.c \
            src/sr-scene-tracker.c

      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sr-event-output.c src/sr-replay-take.c src/sr-scene-tracker.c
          if git diff --cached --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git commit -m "fix: preserve replay through stinger return"
          git push origin HEAD:feature/disk-replay-core
