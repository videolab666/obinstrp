name: One-shot camera registry implementation

on:
  push:
    branches:
      - feature/disk-replay-core
    paths:
      - '.github/workflows/apply-camera-registry-once.yaml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disk-replay-core
          fetch-depth: 0
      - name: Apply camera registry
        run: python3 .github/scripts/apply_camera_registry.py
      - name: Install clang-format 19
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet zsh
          brew tap obsproject/tools
          brew install --quiet obsproject/tools/clang-format@19
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> "$GITHUB_PATH"
      - name: Format and commit
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./build-aux/run-clang-format src/sr-event-db.c src/sr-event-db.h
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sr-event-db.c src/sr-event-db.h
          git diff --cached --check
          git commit -m "feat: add persistent EventDB camera registry"
          git push origin HEAD:feature/disk-replay-core

# one-shot trigger 2
