name: Apply hard Pitel namespace detach

on:
  push:
    branches:
      - feature/hardware-zero-copy
    paths:
      - .github/workflows/apply-hard-detach.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-zero-copy
          fetch-depth: 0

      - name: Apply standalone namespace patch
        run: |
          # sr-credit.h keeps its inherited GPL copyright header; only the runtime/public credit is rebranded.
          sed -i "s/'src\/sr-credit.h', //" .github/scripts/hard-detach-pitel.py
          python3 .github/scripts/hard-detach-pitel.py

      - name: Format touched C/C++ sources
        run: |
          clang-format -i \
            src/plugin-main.c \
            src/playback-source.c \
            src/sr-capture.h \
            src/sr-event-output.h \
            src/sr-dock.cpp \
            src/sr-config.c \
            src/sr-replay-setup.h \
            src/sr-scene-tracker.c \
            src/plugin-support.h \
            src/sr-credit.h

      - name: Validate isolation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'sports_replay|SportsReplay|sports-replay' src data installer tools
          grep -q 'pitel_instant_replay_capture' src/sr-capture.h
          grep -q 'pitel_instant_replay_event_output' src/sr-event-output.h
          grep -q 'PitelInstantReplay.EventIn' src/plugin-main.c
          grep -q 'pitel_instant_replay_dock' src/sr-dock.cpp
          grep -q 'Pitel Instant Replay/Recorder' src/sr-config.c
          grep -q 'Pitel Instant Replay A' src/sr-replay-setup.h
          grep -q 'com.videolab666.pitel-instant-replay' buildspec.json
          test -f docs/NAMESPACE_ISOLATION.md
          test -f THIRD_PARTY_NOTICES.md
          test ! -e UPSTREAM.md
          test ! -e docs/BRANDING_COMPATIBILITY.md
          test ! -e docs/obs-forum-post.md
          test ! -e docs/obs-forum-post-bbcode.txt

      - name: Commit product changes and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/scripts/hard-detach-pitel.py .github/workflows/apply-hard-detach.yml
          git add -A
          git commit -m 'refactor: isolate Pitel Instant Replay namespace'
          git push origin HEAD:feature/hardware-zero-copy
